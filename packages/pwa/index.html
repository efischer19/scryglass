<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Scryglass — a browser-based Magic: The Gathering deck simulator and game tool." />
    <title>Scryglass</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png" />
    <script>
      // Initialize theme early to prevent flash of unstyled content
      const stored = localStorage.getItem('scryglass-theme');
      if (stored) {
        document.documentElement.setAttribute('data-theme', stored);
      } else if (typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
